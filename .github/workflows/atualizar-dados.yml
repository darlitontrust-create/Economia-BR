name: Atualizar dados do painel

on:
  schedule:
    - cron: "17 11 * * *"   # todo dia, por volta das 08:17 de Brasília
  workflow_dispatch:         # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar séries do Banco Central
        run: python scripts/atualizar_dados.py
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza dados do painel"
          git push
